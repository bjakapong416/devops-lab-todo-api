# =============================================================================
# LAB 1 — ทำความรู้จักโครงสร้าง Workflow
# เป้าหมาย: เข้าใจ 5 องค์ประกอบหลัก  Event -> Workflow -> Job -> Step -> Action
# =============================================================================

name: 01 - Hello Actions # ชื่อที่แสดงในแท็บ Actions

# ---- (1) EVENT : เหตุการณ์อะไรที่ทำให้ workflow นี้ทำงาน ---------------------
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ปุ่มกดรันเองจากหน้าเว็บ (มีประโยชน์มากตอนสาธิต)
    inputs:
      greeting:
        description: 'ข้อความที่อยากให้ workflow ทักทาย'
        required: false
        default: 'สวัสดีชาว DevOps'

# ---- สิทธิ์ของ GITHUB_TOKEN : ให้น้อยที่สุดเท่าที่จำเป็น (least privilege) ----
permissions:
  contents: read

jobs:
  # ---- (2) JOB : หน่วยงานที่รันบนเครื่อง (runner) หนึ่งเครื่อง ----------------
  say-hello:
    name: ทักทายและสำรวจ runner
    runs-on: ubuntu-latest # ปัจจุบัน = Ubuntu 24.04 ที่ GitHub เตรียมให้ฟรี

    steps:
      # ---- (3) STEP แบบ "uses" : เรียกใช้ Action ที่คนอื่นเขียนไว้ -----------
      - name: ดึงโค้ดลงมาไว้บน runner
        uses: actions/checkout@v7

      # ---- (4) STEP แบบ "run" : สั่ง shell command ตรง ๆ --------------------
      - name: ทักทาย
        run: echo "${{ inputs.greeting || 'สวัสดีชาว DevOps' }}"

      - name: ดูว่า runner หน้าตาเป็นอย่างไร
        run: |
          echo "OS        : $(uname -a)"
          echo "Node      : $(node --version)"
          echo "Docker    : $(docker --version)"
          echo "โฟลเดอร์งาน: ${GITHUB_WORKSPACE}"
          echo "ไฟล์ในโปรเจกต์:"
          ls -la

      # ---- context ต่าง ๆ ที่ GitHub ใส่มาให้ ------------------------------
      - name: สำรวจ context
        run: |
          echo "repo        = ${{ github.repository }}"
          echo "event       = ${{ github.event_name }}"
          echo "branch/ref  = ${{ github.ref }}"
          echo "commit sha  = ${{ github.sha }}"
          echo "ผู้สั่งรัน   = ${{ github.actor }}"
          echo "run number  = ${{ github.run_number }}"

      # ---- ส่งข้อมูลข้าม step ด้วย output --------------------------------
      - name: สร้าง output
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ใช้ output จาก step ก่อนหน้า
        run: echo "commit สั้น = ${{ steps.meta.outputs.short_sha }}"

      # ---- เขียนสรุปสวย ๆ ขึ้นหน้า Summary ของ run --------------------------
      - name: เขียนสรุป
        run: |
          {
            echo "## ผลการรัน Lab 1"
            echo ""
            echo "| หัวข้อ | ค่า |"
            echo "|---|---|"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Commit | ${{ steps.meta.outputs.short_sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- job ที่รันขนานกับ job แรก (ไม่มี needs) -------------------------------
  matrix-demo:
    name: สาธิต matrix (${{ matrix.fruit }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fruit: [มะม่วง, ทุเรียน, มังคุด]
    steps:
      - run: echo "job นี้ถูกโคลนออกมา 3 ชุด ชุดนี้ได้ค่า = ${{ matrix.fruit }}"

  # ---- job ที่รอ job อื่นเสร็จก่อน ด้วย needs -------------------------------
  summary:
    name: สรุปผล
    runs-on: ubuntu-latest
    needs: [say-hello, matrix-demo] # ← สร้างลำดับการทำงาน (dependency graph)
    if: always() # รันเสมอ แม้ job ก่อนหน้าจะล้มเหลว
    steps:
      - run: |
          echo "say-hello   = ${{ needs.say-hello.result }}"
          echo "matrix-demo = ${{ needs.matrix-demo.result }}"
